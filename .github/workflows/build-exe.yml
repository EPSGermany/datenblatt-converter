name: Build Datenblatt-Converter.exe

# Läuft automatisch bei jedem Push nach main/master, UND kann jederzeit
# manuell über den "Run workflow"-Button im Actions-Tab gestartet werden.
"on":
  push:
    branches: [main, master]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: datenblatt-app
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Python installieren (volle Version inkl. tkinter)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt

      - name: EXE bauen
        run: pyinstaller --noconfirm --onefile --windowed --name "Datenblatt-Converter" app.py

      - name: Vorlagen neben die EXE legen
        run: |
          copy vorlage.docx dist\vorlage.docx
          copy vorlage_en.docx dist\vorlage_en.docx
        shell: cmd

      - name: EXE + Vorlagen als Download bereitstellen (flach, gleicher Ordner)
        uses: actions/upload-artifact@v4
        with:
          name: Datenblatt-Converter
          path: datenblatt-app/dist
          if-no-files-found: error
